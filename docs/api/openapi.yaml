openapi: 3.0.3
info:
  title: NovaPay Immutable Double-Entry Financial Ledger API
  version: 1.0.0
  description: Double-entry ledger with SHA-256 hash chaining, 20 transaction types, FX snapshots, unrealised FX revaluation, partial refunds, anomaly detection, circuit breakers, and financial reporting.
servers:
  - url: http://localhost:8080
paths:
  /api/ledger/health:
    get: { summary: System health & audit status, responses: { '200': { description: OK } } }
  /api/ledger/accounts:
    get: { summary: List Chart of Accounts, responses: { '200': { description: OK } } }
  /api/ledger/transactions:
    post: { summary: Post balanced journal entries, responses: { '200': { description: Posted }, '409': { description: Conflict }, '422': { description: Unbalanced } } }
  /api/ledger/transactions/typed:
    post: { summary: Execute any of the 20 neo-banking transaction types, responses: { '200': { description: Posted } } }
  /api/ledger/transfer:
    post: { summary: Atomic P2P transfer with pessimistic locking, responses: { '200': { description: Transferred } } }
  /api/ledger/reversals/{journalId}:
    post: { summary: Full no-mutation mirror reversal, responses: { '200': { description: Reversed } } }
  /api/ledger/refunds/partial:
    post: { summary: Partial refund with PROPORTIONAL/FULL/NONE fee policies, responses: { '200': { description: Refunded }, '409': { description: Duplicate }, '422': { description: Exceeds original } } }
  /api/ledger/fx/rates:
    post: { summary: Save immutable FX rate snapshot, responses: { '200': { description: Saved } } }
  /api/ledger/fx/convert/usd-to-inr:
    post: { summary: Convert USD to INR with 0.5% markup & stale rate check, responses: { '200': { description: Converted }, '422': { description: Stale rate } } }
  /api/ledger/fx/revalue:
    post: { summary: Run unrealised FX P&L revaluation batch job, responses: { '200': { description: Revalued } } }
  /api/ledger/trial-balance:
    get: { summary: Real-time Trial Balance, responses: { '200': { description: OK } } }
  /api/ledger/reports/income-statement:
    get: { summary: Income Statement (P&L), responses: { '200': { description: OK } } }
  /api/ledger/reports/balance-sheet:
    get: { summary: Balance Sheet (A = L + E), responses: { '200': { description: OK } } }
  /api/ledger/reports/currency-exposure:
    get: { summary: Multi-Currency Exposure Report, responses: { '200': { description: OK } } }
  /api/ledger/accounts/{id}/statement/csv:
    get: { summary: Export account statement as CSV, responses: { '200': { description: OK } } }
  /api/ledger/audit:
    get: { summary: Verify SHA-256 cryptographic hash chain, responses: { '200': { description: OK } } }
  /api/ledger/audit/anomalies:
    get: { summary: Detect suspicious large round-number or after-hours entries, responses: { '200': { description: OK } } }
  /api/ledger/circuit-breaker/status:
    get: { summary: External dependency circuit breaker states, responses: { '200': { description: OK } } }
