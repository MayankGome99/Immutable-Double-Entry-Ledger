services:
  db:
    image: postgres:15
    container_name: ledger_postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ledger_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledger_db?options=-c%20TimeZone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "8080:8080"