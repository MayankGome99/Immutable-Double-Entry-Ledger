services:
  db:
    image: postgres:15
    container_name: ledger_postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tests:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledger_db?TimeZone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      TZ: UTC
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    command: ["mvn", "clean", "verify"]

volumes:
  postgres_data:
  maven_cache: